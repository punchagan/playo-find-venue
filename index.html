<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="utf-8">
    <meta name="description" content="Courtly — Play closer to home. Find the nearest sports courts and venues near you across Bangalore, Hyderabad, Chennai and Delhi.">
    <title>Courtly — Play closer to home</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin="" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6C5CE7;
            --primary-light: #A29BFE;
            --primary-dark: #5A4BD1;
            --accent: #00CEC9;
            --accent-light: #81ECEC;
            --bg-dark: #0F0F1A;
            --bg-card: #1A1A2E;
            --bg-card-hover: #222240;
            --text-primary: #EAEAFF;
            --text-secondary: #9090B0;
            --text-muted: #606080;
            --border: #2A2A45;
            --success: #00B894;
            --warning: #FDCB6E;
            --danger: #FF6B6B;
            --shadow: 0 8px 32px rgba(0,0,0,0.3);
            --radius: 16px;
            --radius-sm: 10px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
        }

        /* Layout */
        .app-layout {
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 420px;
            min-width: 420px;
            background: var(--bg-dark);
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
            z-index: 1000;
            position: relative;
        }

        .sidebar-header {
            padding: 24px 20px 16px;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 4px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .logo h1 {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-light), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-subtitle {
            font-size: 12px;
            color: var(--text-muted);
            margin-left: 50px;
            margin-top: -2px;
        }

        /* Controls */
        .controls {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
        }

        .control-row {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        .control-row:last-child {
            margin-bottom: 0;
        }

        .select-wrapper {
            position: relative;
            flex: 1;
        }

        .select-wrapper select {
            width: 100%;
            padding: 10px 14px;
            padding-right: 32px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .select-wrapper select:hover {
            border-color: var(--primary);
        }

        .select-wrapper select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.2);
        }

        .select-wrapper::after {
            content: '▾';
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
            font-size: 12px;
        }

        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(108, 92, 231, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-accent {
            background: linear-gradient(135deg, var(--accent), #00B894);
            color: var(--bg-dark);
        }

        .btn-accent:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(0, 206, 201, 0.4);
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .btn-ghost:hover {
            background: var(--bg-card);
            color: var(--text-primary);
        }

        .location-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            font-size: 13px;
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .location-status.active {
            border-color: var(--success);
            color: var(--success);
        }

        .location-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
            flex-shrink: 0;
        }

        .location-status.active .location-dot {
            background: var(--success);
            box-shadow: 0 0 8px rgba(0, 184, 148, 0.6);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Search */
        .search-container {
            position: relative;
            margin-bottom: 12px;
        }

        .search-input {
            width: 100%;
            padding: 10px 14px 10px 38px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.2);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
            pointer-events: none;
        }

        .search-results {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow);
            z-index: 1001;
            display: none;
            max-height: 200px;
            overflow-y: auto;
        }

        .search-results .result-item {
            padding: 10px 14px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border);
            transition: background 0.15s;
        }

        .search-results .result-item:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
        }

        .search-results .result-item:last-child {
            border-bottom: none;
        }

        /* Venue List */
        .venue-list-header {
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }

        .venue-list-header h2 {
            font-size: 14px;
            font-weight: 600;
        }

        .venue-count {
            font-size: 12px;
            color: var(--text-muted);
            background: var(--bg-card);
            padding: 4px 10px;
            border-radius: 20px;
        }

        .venue-list {
            flex: 1;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }

        .venue-list::-webkit-scrollbar {
            width: 6px;
        }

        .venue-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .venue-list::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        .venue-card {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.15s;
            position: relative;
        }

        .venue-card:hover {
            background: var(--bg-card);
        }

        .venue-card.active {
            background: var(--bg-card);
            border-left: 3px solid var(--primary);
        }

        .venue-card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        .venue-name {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.3;
            flex: 1;
        }

        .venue-distance {
            font-size: 12px;
            font-weight: 600;
            color: var(--accent);
            white-space: nowrap;
            background: rgba(0, 206, 201, 0.1);
            padding: 3px 8px;
            border-radius: 6px;
        }

        .venue-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 6px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .venue-rating {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .rating-stars {
            color: var(--warning);
            font-size: 11px;
            letter-spacing: 1px;
        }

        .rating-value {
            font-weight: 600;
            color: var(--text-primary);
        }

        .rating-count {
            color: var(--text-muted);
        }

        .venue-sports {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-top: 6px;
        }

        .sport-tag {
            font-size: 11px;
            padding: 2px 8px;
            background: rgba(108, 92, 231, 0.15);
            color: var(--primary-light);
            border-radius: 4px;
        }

        .venue-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .venue-link {
            font-size: 11px;
            color: var(--primary-light);
            text-decoration: none;
            padding: 4px 10px;
            background: rgba(108, 92, 231, 0.1);
            border-radius: 6px;
            transition: background 0.2s;
        }

        .venue-link:hover {
            background: rgba(108, 92, 231, 0.25);
        }

        /* Sort indicator */
        .sort-info {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Map container */
        .map-container {
            flex: 1;
            position: relative;
        }

        #map {
            height: 100%;
            width: 100%;
        }

        /* Empty state */
        .empty-state {
            padding: 40px 20px;
            text-align: center;
            color: var(--text-muted);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .empty-state h3 {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .empty-state p {
            font-size: 13px;
            line-height: 1.5;
        }

        /* Loading spinner */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 20px;
            color: var(--text-muted);
            font-size: 13px;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Footer */
        .sidebar-footer {
            padding: 10px 20px;
            border-top: 1px solid var(--border);
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
        }

        .sidebar-footer a {
            color: var(--primary-light);
            text-decoration: none;
        }

        .sidebar-footer .love {
            color: #FF6B6B;
        }

        /* Leaflet overrides for dark theme */
        .leaflet-container {
            background: var(--bg-dark);
        }

        .leaflet-popup-content-wrapper {
            background: var(--bg-card);
            color: var(--text-primary);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .leaflet-popup-content {
            margin: 12px 16px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            line-height: 1.5;
        }

        .leaflet-popup-content h3 {
            font-size: 15px;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .leaflet-popup-content a {
            color: var(--primary-light);
        }

        .leaflet-popup-tip {
            background: var(--bg-card);
            border: 1px solid var(--border);
        }

        .leaflet-control-zoom a {
            background: var(--bg-card) !important;
            color: var(--text-primary) !important;
            border-color: var(--border) !important;
        }

        .leaflet-control-zoom a:hover {
            background: var(--bg-card-hover) !important;
        }

        .leaflet-control-attribution {
            background: rgba(15, 15, 26, 0.8) !important;
            color: var(--text-muted) !important;
            font-size: 10px !important;
        }

        .leaflet-control-attribution a {
            color: var(--text-secondary) !important;
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
            .app-layout {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                min-width: unset;
                max-height: 50vh;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
            .map-container {
                flex: 1;
            }
        }

        /* User location marker pulse */
        .user-marker {
            background: var(--primary);
            border: 3px solid white;
            border-radius: 50%;
            box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.3), 0 2px 8px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-icon">🏸</div>
                    <h1>Courtly</h1>
                </div>
                <p class="logo-subtitle">Play closer to home</p>
            </div>

            <div class="controls">
                <div class="search-container">
                    <span class="search-icon">🔍</span>
                    <input type="text" class="search-input" id="searchInput" placeholder="Search a location..." />
                    <div class="search-results" id="searchResults"></div>
                </div>

                <div class="control-row">
                    <div class="select-wrapper">
                        <select id="citySelect"></select>
                    </div>
                    <div class="select-wrapper">
                        <select id="sportFilter"></select>
                    </div>
                </div>

                <div class="control-row">
                    <button class="btn btn-primary" id="locateBtn" onclick="locateMe()">📍 Use My Location</button>
                    <div class="location-status" id="locationStatus">
                        <div class="location-dot"></div>
                        <span id="locationText">Location not set</span>
                    </div>
                </div>
            </div>

            <div class="venue-list-header">
                <h2>Nearby Courts</h2>
                <div style="display:flex;align-items:center;gap:10px;">
                    <span class="sort-info" id="sortInfo">↕ By distance</span>
                    <span class="venue-count" id="venueCount">0 venues</span>
                </div>
            </div>

            <div class="venue-list" id="venueList">
                <div class="empty-state" id="emptyState">
                    <div class="empty-state-icon">📍</div>
                    <h3>Set your location</h3>
                    <p>Click "Use My Location" or search for a place to find the nearest badminton courts.</p>
                </div>
            </div>

            <div class="sidebar-footer">
                <strong>Courtly</strong> &middot; Powered by <a href="https://playo.co" target="_blank">Playo</a> data &middot; Built with <span class="love">❤</span> in India
            </div>
        </div>

        <div class="map-container">
            <div id="map"></div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
    <script src="js/app.js"></script>
    <!-- GoatCounter — free, privacy-friendly analytics (no cookies) -->
    <!-- Sign up at https://www.goatcounter.com and replace YOUR_SITE_CODE below -->
    <script data-goatcounter="https://YOUR_SITE_CODE.goatcounter.com/count"
            async src="//gc.zgo.at/count.js"></script>
</body>
</html>
